<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>slot-text playground</title>
    <link rel="stylesheet" href="../../style.css" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        font:
          600 16px/1.2 ui-sans-serif,
          system-ui,
          sans-serif;
        background: #0e1116;
        color: #edf2f7;
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      p {
        margin: 0;
        color: #9ca3af;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      button {
        --button-text-color: #0c50c6;
        min-width: 112px;
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        background: #edf2f7;
        color: var(--button-text-color);
        font: inherit;
        cursor: pointer;
        box-shadow: 0 1px 1px rgb(0 0 0 / 20%);
        transition: transform 160ms cubic-bezier(0.2, 0, 0, 1);
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: scale(0.96);
      }

      #copy-label,
      #copy-label .char-face {
        color: var(--button-text-color);
      }
    </style>
  </head>
  <body>
    <main>
      <p>Click the button to test slot-text.</p>
      <button type="button"><span id="copy-label"></span></button>
    </main>

    <script type="module">
      import { slotText, chromatic } from "../../dist/index.js";

      const button = document.querySelector("button");
      const label = slotText(document.querySelector("#copy-label"), "Copy");

      button.addEventListener("click", () => {
        label.flash("Copied", {
          enter: {
            direction: "up",
            skipUnchanged: false,
            color: chromatic({ from: 190 }),
          },
          exit: {
            direction: "down",
            skipUnchanged: false,
            color: chromatic({ from: 190 }),
          },
        });
      });
    </script>
  </body>
</html>
